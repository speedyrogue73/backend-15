{% extends 'base.html' %}

{% block content %}
<div class="d-flex flex-row align-items-stretch gap-4 p-2 flex-wrap">
    {% for post in posts %}
    <div class="card rounded rounded-4 p-3 d-flex flex-column shadow-sm" style="width: 19rem; height: 460px;">
        {% if post.poster %}
        <img src="{{ post.poster.url }}" alt="{{ post.title }}" class="card-img-top rounded-3"
            style="height: 170px; width: 100%; object-fit: cover;">
        {% endif %}
        <h2 class="card-title h4 mt-2 text-truncate" title="{{ post.title }}">{{ post.title }}</h2>
        <p class="card-text text-muted flex-grow-1"
            style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
            {{ post.body|truncatechars:90 }}
        </p>
        <a href="{% url 'home:detail' post.slug %}" class="btn btn-info w-100 mb-2">detail</a>
        <div class="mt-auto pt-2 border-top d-flex justify-content-between align-items-center text-muted small text-nowrap"
            style="font-size: 0.75rem;">
            <span>{{ post.user.username }}</span>
            <span>---</span>
            <span>{{ post.created_at|timesince }} ago</span>
            <span>-----</span>
            <span>{{ post.view_count|default:"0" }}</span>
        </div>
    </div>
{% endfor %}
</div>
{% endblock %}
